services:
  postgres:
    image: postgres:16-alpine
    container_name: ordexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ordexa_db}
      POSTGRES_USER: ${POSTGRES_USER:-ordexa_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env or environment}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ordexa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ordexa_app} -d ${POSTGRES_DB:-ordexa_db}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ordexa_network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ordexa-backend
    profiles:
      - full-stack
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-ordexa_db}
      DB_USERNAME: ${POSTGRES_USER:-ordexa_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env or environment}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      CALLING_ENABLED: ${CALLING_ENABLED:-true}
      CALLING_PROVIDER: ${CALLING_PROVIDER:-SANDBOX}
      CALLING_VOICE_SERVICE_URL: ${CALLING_VOICE_SERVICE_URL:-http://voice-service:3104}
      CALLING_WEBHOOK_SECRET: ${CALLING_WEBHOOK_SECRET:-northstar-dev-calling-webhook-signing-secret-min-32b}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    networks:
      - ordexa_network

  voice-service:
    build:
      context: ./voice-service
      dockerfile: Dockerfile
    container_name: northstar-voice-service
    profiles:
      - full-stack
      - voice
    restart: unless-stopped
    environment:
      VOICE_SERVICE_PORT: 3104
      CALLING_DISPATCH_MODE: ${CALLING_DISPATCH_MODE:-DRY_RUN}
      NORTHSTAR_BACKEND_URL: http://backend:8080
      CALLING_WEBHOOK_SECRET: ${CALLING_WEBHOOK_SECRET:-northstar-dev-calling-webhook-signing-secret-min-32b}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_SIP_TRUNK_ID_VOBIZ: ${LIVEKIT_SIP_TRUNK_ID_VOBIZ:-}
      LIVEKIT_SIP_TRUNK_ID_TWILIO: ${LIVEKIT_SIP_TRUNK_ID_TWILIO:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:${VOICE_SERVICE_PORT:-3104}:3104"
    networks:
      - ordexa_network

volumes:
  ordexa_postgres_data:
    name: ordexa_postgres_data

networks:
  ordexa_network:
    name: ordexa_network
    driver: bridge
