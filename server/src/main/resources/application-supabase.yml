# ============================================================================
# Supabase Cloud PostgreSQL Profile (`SPRING_PROFILES_ACTIVE=supabase`)
# Uses Supabase Shared Pooler (Session Mode, port 5432) with mandatory SSL.
# Supply SUPABASE_DB_PASSWORD or SPRING_DATASOURCE_PASSWORD via environment.
# ============================================================================
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${SUPABASE_DB_HOST:aws-1-ap-southeast-2.pooler.supabase.com}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:${SUPABASE_DB_USERNAME:postgres.cumzjxsxjxvhhldsjluj}}
    password: ${SPRING_DATASOURCE_PASSWORD:${SUPABASE_DB_PASSWORD:}}
    hikari:
      pool-name: OrdexaSupabasePool
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: 20000
      validation-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 900000
      keepalive-time: 120000
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

ordexa:
  security:
    jwt:
      secret: ${JWT_SECRET:ordexa-local-dev-only-jwt-signing-key-2026-min-256-bits-required}
      cookie-secure: ${AUTH_COOKIE_SECURE:false}
      cookie-same-site: ${AUTH_COOKIE_SAMESITE:Lax}

logging:
  level:
    com.ordexa: INFO
    org.flywaydb: INFO
    org.springframework.web: WARN
