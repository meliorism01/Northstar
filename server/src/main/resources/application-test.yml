# ============================================================================
# Automated Test Profile (`SPRING_PROFILES_ACTIVE=test`)
# ============================================================================
spring:
  datasource:
    url: jdbc:h2:mem:ordexa_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

ordexa:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  security:
    jwt:
      secret: ordexa-automated-test-jwt-signing-secret-key-minimum-32-bytes-long
      issuer: https://auth.ordexa.test
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 604800
      cookie-name: ordexa_refresh_token
      cookie-secure: false
      cookie-same-site: Lax
