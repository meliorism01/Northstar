# ============================================================================
# Local Development Profile (`SPRING_PROFILES_ACTIVE=local`)
# ============================================================================
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:ordexa_db}
    username: ${DB_USERNAME:ordexa_app}
    password: ${DB_PASSWORD:change_me_local_dev_password_only}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

ordexa:
  security:
    jwt:
      secret: ${JWT_SECRET:ordexa-local-dev-only-jwt-signing-key-2026-min-256-bits-required}
      cookie-secure: ${AUTH_COOKIE_SECURE:false}
      cookie-same-site: ${AUTH_COOKIE_SAMESITE:Lax}

logging:
  level:
    com.ordexa: INFO
    org.flywaydb: INFO
    org.springframework.web: WARN
