spring:
  application:
    name: NORTHSTAR
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:ordexa_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:ordexa_app}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: OrdexaHikariPool
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 15000
      validation-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    fail-on-missing-locations: true
    locations: classpath:db/migration
    table: flyway_schema_history

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    db:
      enabled: true
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}
    operations-sorter: method
    tags-sorter: alpha

ordexa:
  calling:
    enabled: ${CALLING_ENABLED:true}
    provider: ${CALLING_PROVIDER:SANDBOX}
    voice-service-url: ${CALLING_VOICE_SERVICE_URL:http://127.0.0.1:3104}
    webhook-secret: ${CALLING_WEBHOOK_SECRET:northstar-dev-calling-webhook-signing-secret-min-32b}
    scheduler-enabled: ${CALLING_SCHEDULER_ENABLED:true}
    scheduler-interval-ms: ${CALLING_SCHEDULER_INTERVAL_MS:15000}
    batch-size: ${CALLING_BATCH_SIZE:15}
    http-timeout-seconds: ${CALLING_HTTP_TIMEOUT_SECONDS:8}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:https://auth.ordexa.internal}
      access-token-ttl-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:900}
      refresh-token-ttl-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:604800}
      cookie-name: ${AUTH_COOKIE_NAME:ordexa_refresh_token}
      cookie-secure: ${AUTH_COOKIE_SECURE:true}
      cookie-same-site: ${AUTH_COOKIE_SAMESITE:Strict}

northstar:
  nbie:
    enabled: ${NBIE_ENABLED:true}
    ruleset-version: ${NBIE_RULESET_VERSION:NBIE_RULESET_V1}
    auto-evaluate: ${NBIE_AUTO_EVALUATE:false}
    default-recommendation-ttl-hours: ${NBIE_RECOMMENDATION_TTL_HOURS:24}
    max-rto-assessment-age-minutes: ${NBIE_MAX_RTO_AGE_MINUTES:60}
    stale-call-signal-hours: ${NBIE_STALE_CALL_HOURS:24}
    sandbox-only: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [corrId=%X{correlationId:-none}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.ordexa: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
