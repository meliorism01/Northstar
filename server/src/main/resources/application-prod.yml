# ============================================================================
# Production Profile (`SPRING_PROFILES_ACTIVE=prod`)
# All connection and signing secrets must be supplied via runtime env vars.
# ============================================================================
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

ordexa:
  security:
    jwt:
      secret: ${JWT_SECRET}
      cookie-secure: true
      cookie-same-site: Strict

logging:
  level:
    root: WARN
    com.ordexa: INFO
