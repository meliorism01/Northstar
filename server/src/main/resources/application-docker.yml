# ============================================================================
# Docker Container Profile (`SPRING_PROFILES_ACTIVE=docker`)
# ============================================================================
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:ordexa_db}
    username: ${DB_USERNAME:ordexa_app}
    password: ${DB_PASSWORD}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

ordexa:
  security:
    jwt:
      secret: ${JWT_SECRET}
      cookie-secure: ${AUTH_COOKIE_SECURE:false}
      cookie-same-site: ${AUTH_COOKIE_SAMESITE:Lax}
